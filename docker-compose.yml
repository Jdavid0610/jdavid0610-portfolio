services:
  db:
    image: postgres:17-alpine
    container_name: next-stack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: next_stack
    ports:
      # 5433 on the host so it never fights a locally installed Postgres.
      - '5433:5432'
    volumes:
      - next-stack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  next-stack-pgdata:
